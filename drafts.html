<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entwürfe · Reisekostenabrechnung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Topbar -->
<div id="topbar-mount"></div>

<main>
  <div class="card">
    <!-- Card header with title and action -->
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #E2E0DA">
      <div class="section-title" style="margin:0;padding:0;border:none">📋 Gespeicherte Entwürfe</div>
      <a href="index.html" class="btn-primary" style="text-decoration:none;font-size:13px;font-weight:500;background:#1D9E75;color:#fff;border-radius:10px;padding:9px 18px;display:inline-flex;align-items:center;gap:6px">
        + Neue Abrechnung
      </a>
    </div>

    <!-- Drafts list -->
    <div id="drafts-list"></div>
  </div>
</main>

<!-- Toast container -->
<div id="toast-container"></div>

<script src="app.js"></script>

<script>
'use strict';

function init() {
  document.getElementById('topbar-mount').innerHTML = renderTopbar('drafts');
  renderDrafts();
}

function getDraftBetrag(d) {
  var m = d.mitarbeiter || {};
  var pendelEinfach = m.pendelKmEinfach || 0;
  var fahrten = d.fahrten || [];
  var fahrtBetrag = 0;
  fahrten.forEach(function(f) {
    var km = +(f.kmEinfach || 0);
    fahrtBetrag += Math.max(0, km * 2 - pendelEinfach * 2) * 0.30;
  });
  var s = d.spesen || {};
  var spesenSum = (s.uebernacht || 0) + (s.opnv || 0) + (s.parken || 0) + (s.sonstige || 0);
  return fahrtBetrag + spesenSum;
}

function renderDrafts() {
  var list = document.getElementById('drafts-list');
  if (!list) return;

  var drafts = getDrafts().slice().sort(function(a, b) {
    return new Date(b.savedAt || 0) - new Date(a.savedAt || 0);
  });

  if (drafts.length === 0) {
    list.innerHTML = [
      '<div class="empty-state">',
      '<div class="empty-state-icon">📂</div>',
      '<p>Keine Entwürfe vorhanden.</p>',
      '<a href="index.html" class="btn-primary" style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">',
      '+ Neue Abrechnung erstellen',
      '</a>',
      '</div>'
    ].join('');
    return;
  }

  list.innerHTML = drafts.map(function(d) {
    var m = d.mitarbeiter || {};
    var vn = m.vorname || '';
    var nn = m.nachname || '';
    var initials = ((vn[0] || '') + (nn[0] || '')).toUpperCase() || '?';
    var name = [vn, nn].filter(Boolean).join(' ') || 'Unbenannt';
    var nFahrten = (d.fahrten || []).length;
    var betrag = getDraftBetrag(d);
    var savedAt = d.savedAt ? fmtDateTime(d.savedAt) : '–';

    return [
      '<div class="draft-card">',
        '<div class="draft-avatar">' + esc(initials) + '</div>',
        '<div class="draft-info">',
          '<div class="draft-name">',
            esc(name),
            '<span class="draft-id-badge">' + esc(d.id || '–') + '</span>',
          '</div>',
          '<div class="draft-meta">',
            esc(nFahrten) + ' Fahrt' + (nFahrten !== 1 ? 'en' : '') +
            ' · Gesamt: ' + esc(fmt(betrag)) +
            ' · Gespeichert: ' + esc(savedAt),
          '</div>',
        '</div>',
        '<div class="draft-actions">',
          '<a href="index.html?draft=' + encodeURIComponent(d.id || '') + '" class="btn-primary" style="text-decoration:none">Weiterbearbeiten</a>',
          '<button class="btn-danger btn-icon" onclick="loeschenDraft(\'' + esc(d.id || '') + '\')" title="Entwurf löschen">🗑</button>',
        '</div>',
      '</div>'
    ].join('');
  }).join('');
}

function loeschenDraft(id) {
  if (!confirm('Entwurf ' + id + ' wirklich löschen?')) return;
  deleteDraft(id);
  renderDrafts();
  showToast('Entwurf gelöscht.', 'ok');
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
