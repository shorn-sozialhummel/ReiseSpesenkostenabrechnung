<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entwürfe · Reisekostenabrechnung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js"></script>
</head>
<body>

<div id="topbar-mount"></div>

<main>
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;
                margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--gray-200)">
      <div class="sec-title" style="margin:0;padding:0;border:none">📋 Gespeicherte Entwürfe</div>
      <a href="index.html" class="btn-primary" style="text-decoration:none">
        + Neue Abrechnung
      </a>
    </div>
    <div id="drafts-list"></div>
  </div>
</main>

<div id="toast"></div>
<script src="app.js"></script>
<script>
'use strict';

function getDraftBetrag(d) {
  var m        = d.mitarbeiter || {};
  var pendelKm = (m.pendelKmEinfach || 0) * 2;
  var gesamt   = 0;
  (d.fahrten || []).forEach(function (f) {
    var modus   = f.modus || 'hinrueck';
    var kmHin   = parseInt(f.kmHin)   || 0;
    var kmRueck = parseInt(f.kmRueck) || 0;
    var gesamtKm;
    if      (modus === 'einfach')    gesamtKm = kmHin;
    else if (modus === 'hinrueck')   gesamtKm = kmHin * 2;
    else                             gesamtKm = kmHin + kmRueck;
    var keinAbzug = f.startTyp === 'arbeitsort';
    var erstKm    = keinAbzug ? gesamtKm : Math.max(0, gesamtKm - pendelKm);
    gesamt += erstKm * 0.30;
  });
  var sp = d.spesen || {};
  gesamt += (sp.uebernachtung || 0) + (sp.opnv || 0) + (sp.parken || 0) + (sp.sonstige || 0);
  return gesamt;
}

function getModusUebersicht(fahrten) {
  var counts = {};
  (fahrten || []).forEach(function (f) {
    var mod = f.modus || 'hinrueck';
    counts[mod] = (counts[mod] || 0) + 1;
  });
  var parts = [];
  if (counts.einfach)    parts.push(counts.einfach    + '× Einfach');
  if (counts.hinrueck)   parts.push(counts.hinrueck   + '× H+R');
  if (counts.mehrtaegig) parts.push(counts.mehrtaegig + '× Mehrtägig');
  return parts.join(', ') || '–';
}

function renderDrafts() {
  var list = document.getElementById('drafts-list');
  if (!list) return;

  var drafts = getDrafts().slice().sort(function (a, b) {
    return new Date(b.savedAt || 0) - new Date(a.savedAt || 0);
  });

  if (drafts.length === 0) {
    list.innerHTML =
      '<div class="empty-state">' +
        '<div class="empty-state-icon">📂</div>' +
        '<p>Keine Entwürfe vorhanden.</p>' +
        '<a href="index.html" class="btn-primary"' +
        ' style="text-decoration:none;display:inline-flex;align-items:center;gap:6px">' +
          '+ Neue Abrechnung erstellen' +
        '</a>' +
      '</div>';
    return;
  }

  list.innerHTML = drafts.map(function (d) {
    var m        = d.mitarbeiter || {};
    var vn       = m.vorname  || '';
    var nn       = m.nachname || '';
    var initials = ((vn[0] || '') + (nn[0] || '')).toUpperCase() || '?';
    var name     = [vn, nn].filter(Boolean).join(' ') || 'Unbenannt';
    var nFahrten = (d.fahrten || []).length;
    var betrag   = getDraftBetrag(d);
    var modi     = getModusUebersicht(d.fahrten);
    var savedAt  = d.savedAt ? fmtDateTime(d.savedAt) : '–';

    return (
      '<div class="draft-card">' +
        '<div class="draft-avatar">' + esc(initials) + '</div>' +
        '<div class="draft-info">' +
          '<div class="draft-name">' +
            esc(name) +
            '<span class="draft-id">' + esc(d.id || '–') + '</span>' +
          '</div>' +
          '<div class="draft-meta">' +
            nFahrten + ' Fahrt' + (nFahrten !== 1 ? 'en' : '') +
            ' (' + esc(modi) + ')' +
            ' · Gesamt: <strong>' + esc(fmt(betrag)) + '</strong>' +
            ' · Gespeichert: ' + esc(savedAt) +
          '</div>' +
        '</div>' +
        '<div class="draft-actions">' +
          '<a href="index.html?draft=' + encodeURIComponent(d.id || '') + '"' +
          ' class="btn-primary" style="text-decoration:none">Weiterbearbeiten</a>' +
          '<button class="btn-danger btn-icon"' +
          ' onclick="loeschenDraft(\'' + esc(d.id || '') + '\')"' +
          ' title="Löschen">🗑</button>' +
        '</div>' +
      '</div>'
    );
  }).join('');
}

function loeschenDraft(id) {
  if (!confirm('Entwurf ' + id + ' wirklich löschen?')) return;
  deleteDraft(id);
  renderDrafts();
  showToast('Entwurf gelöscht.', 'ok');
}

document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('topbar-mount').innerHTML = renderTopbar('drafts');
  renderDrafts();
});
</script>

</body>
</html>
